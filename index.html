<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316"><title>Foodtrack — Food, delivered live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--orange:#f97316;--deep:#ea580c;--ink:#1f2937;--muted:#6b7280;--bg:#fffaf5;--card:#fff;--line:#f1e7df;--green:#15803d;--shadow:0 12px 35px #3b1d0c0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px 15px;font-weight:750;transition:.15s}button:active{transform:scale(.98)}.primary{background:var(--orange);color:white}.primary:hover{background:var(--deep)}.secondary{background:#fff0e4;color:#c2410c}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fee2e2;color:#991b1b}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:23px;letter-spacing:-.8px}.logo{width:43px;height:43px;border-radius:15px;background:var(--orange);display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 8px 18px #f9731633}.brand span{color:var(--orange)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}.pill{border-radius:999px;background:#fff0e4;color:#c2410c;padding:7px 11px;font-size:12px;font-weight:800}.hero{background:linear-gradient(125deg,#fff0df,#fffbf6 65%);border:1px solid #ffe0c2;border-radius:28px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden}.hero h1{font-size:clamp(30px,5vw,49px);line-height:1.04;letter-spacing:-1.7px;margin:12px 0}.hero p{color:var(--muted);max-width:510px;line-height:1.6}.hero-art{font-size:100px;filter:drop-shadow(0 15px 12px #7c2d1220)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 15px}.section-head h2{margin:0;font-size:23px;letter-spacing:-.7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.food-art{height:125px;border-radius:15px;background:linear-gradient(145deg,#fff1df,#fff9f1);display:grid;place-items:center;font-size:62px;margin-bottom:13px}.card h3{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:8px}.price{font-size:18px;font-weight:900}.add{background:#fff0e4;color:#c2410c;padding:9px 13px}.nav{position:sticky;bottom:0;background:#ffffffed;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:space-around;gap:4px;padding:9px 8px max(9px,env(safe-area-inset-bottom));z-index:500}.nav button{background:transparent;color:#777;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:7px 9px;min-width:48px}.nav button.active{color:var(--orange);background:#fff0e4}.nav .ico{font-size:19px}.auth-shell{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#ffedd5,transparent 40%),var(--bg)}.auth-card{width:min(100%,470px);background:white;border:1px solid var(--line);box-shadow:0 20px 70px #5b250d12;border-radius:27px;padding:26px}.auth-card .brand{margin-bottom:22px}.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.role{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 5px;color:var(--muted);font-size:12px}.role strong{display:block;font-size:26px;margin-bottom:5px}.role.selected{border:2px solid var(--orange);background:#fff7ed;color:#c2410c}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800;color:#555}.field input,.field select,.field textarea{border:1px solid #e5e7eb;border-radius:12px;padding:13px;background:#fff;outline:none;width:100%}.field input:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f973161c}.full{width:100%}.linkbtn{background:none;color:var(--deep);padding:8px}.app-shell{min-height:100dvh}.app-header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;position:sticky;top:0;z-index:400}.app-header-inner{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.app-header .brand{font-size:20px}.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}.avatar{width:36px;height:36px;border-radius:50%;background:#ffedd5;color:#c2410c;display:grid;place-items:center;font-weight:900}.content{max-width:1180px;margin:auto;padding:18px 20px 90px}.searchbar{display:flex;gap:9px;margin-top:18px}.searchbar input{flex:1;min-width:0;border:1px solid var(--line);background:white;border-radius:14px;padding:13px}.categories{display:flex;gap:8px;overflow:auto;padding:14px 0}.categories button{white-space:nowrap;background:white;border:1px solid var(--line);padding:9px 13px;color:#555}.categories button.active{background:var(--ink);color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat strong{display:block;font-size:25px;margin:6px 0}.stat span{font-size:12px;color:var(--muted)}.order-list{display:grid;gap:13px}.order-card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}.order-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.status{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:900;border-radius:999px;background:#fff0e4;color:#c2410c;padding:7px 9px;white-space:nowrap}.status.delivered,.status.demo-paid{background:#dcfce7;color:#166534}.order-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.order-actions button{padding:10px 12px;font-size:12px}.map{height:320px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#e5e7eb}.track-layout{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.steps{display:grid;gap:12px;margin:18px 0}.step{display:flex;gap:11px;align-items:flex-start}.step-dot{width:27px;height:27px;flex-shrink:0;border-radius:50%;background:#ffedd5;color:#c2410c;display:grid;place-items:center;font-weight:900}.step.done .step-dot{background:#dcfce7;color:#166534}.step p{margin:2px 0 0;font-size:13px;color:var(--muted)}.empty{text-align:center;padding:36px 16px;color:var(--muted)}.empty .emoji{font-size:42px;margin-bottom:10px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1f2937;color:white;padding:12px 18px;border-radius:12px;z-index:2000;box-shadow:var(--shadow);max-width:90vw;font-size:13px}.qrbox{display:grid;place-items:center;background:#fff;border:1px dashed #fed7aa;border-radius:18px;padding:20px;text-align:center}.qrbox img{max-width:190px;width:100%}.toggle{display:flex;align-items:center;gap:10px}.toggle input{width:20px;height:20px;accent-color:var(--orange)}.profile-row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.demo-note{background:#fffbeb;border:1px solid #fde68a;border-radius:13px;padding:12px;font-size:12px;line-height:1.5;color:#92400e;margin:12px 0}
@media(max-width:760px){.wrap{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:11px;border-radius:16px}.food-art{height:100px;font-size:48px}.hero{padding:20px;border-radius:22px}.hero-art{font-size:62px}.hero p{font-size:13px}.app-header{padding:11px 14px}.content{padding:14px 13px 90px}.track-layout{grid-template-columns:1fr}.map{height:280px}.stats{gap:8px}.stat strong{font-size:21px}.stat{padding:12px}.section-head h2{font-size:20px}.auth-card{padding:20px}.role-grid{gap:5px}.role{padding:10px 2px}.role strong{font-size:23px}.topbar{margin-bottom:16px}}
@media(max-width:370px){.grid{grid-template-columns:1fr}.hero-art{display:none}.nav button{padding:6px 5px}.nav .ico{font-size:17px}}
</style>
</head>
<body><div id="root"><div class="auth-shell"><div class="auth-card"><div class="brand"><div class="logo">🍔</div>Food<span>track</span></div><h2>Good food. Good mood.</h2><p class="muted">Loading your food delivery experience…</p></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
const API="/api";let token=localStorage.getItem("ft_token")||"",user=JSON.parse(localStorage.getItem("ft_user")||"null"),roleChoice="customer",authMode="signup",menu=[],orders=[],cart=[],favorites=JSON.parse(localStorage.getItem("ft_favs")||"[]"),section="home",category="All",query="",socket=null,map=null,watchId=null,online=false,currentLocation=null,activeOrder=null;
const root=document.getElementById("root");
const icons={home:"⌂",search:"⌕",favorites:"♡",tokens:"◈",account:"♙",settings:"⚙"};
const roleNames={customer:"Customer",delivery:"Delivery Partner",restaurant:"Shop / Restaurant"};
const statusNames={pending:"New order",accepted:"Accepted",preparing:"Preparing",ready:"Ready for pickup",picked_up:"On the way",delivered:"Delivered",rejected:"Rejected"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){let n=document.querySelector(".toast");if(n)n.remove();n=document.createElement("div");n.className="toast";n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),3000)}
async function api(path,opts={}){const res=await fetch(API+path,{...opts,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opts.headers||{})}});let data={};try{data=await res.json()}catch{}if(!res.ok)throw Error(data.error||"Something went wrong");return data}
function setSession(data){token=data.token;user=data.user;localStorage.setItem("ft_token",token);localStorage.setItem("ft_user",JSON.stringify(user));startApp()}
function logout(){stopGPS();token="";user=null;localStorage.removeItem("ft_token");localStorage.removeItem("ft_user");if(socket)socket.disconnect();renderAuth()}
function roleSelect(r){roleChoice=r;renderAuth()}
function switchAuth(){authMode=authMode==="signup"?"login":"signup";renderAuth()}
function renderAuth(){
root.innerHTML=`<div class="auth-shell"><div class="auth-card"><div class="brand"><div class="logo">🍔</div>Food<span>track</span></div><span class="pill">REAL-TIME FOOD DELIVERY</span><h1 style="font-size:30px;letter-spacing:-1px;margin:17px 0 6px">${authMode==="signup"?"Your next meal is closer.":"Welcome back!"}</h1><p class="muted" style="margin-top:0">Choose your role to continue.</p><div class="role-grid">${Object.entries(roleNames).map(([k,v])=>`<button class="role ${roleChoice===k?"selected":""}" onclick="roleSelect('${k}')"><strong>${k==="customer"?"🧑":k==="delivery"?"🛵":"🏪"}</strong>${v}</button>`).join("")}</div><form id="authForm"><div class="field ${authMode==="login"?"hidden":""}"><label>FULL NAME</label><input name="name" placeholder="Your name" ${authMode==="signup"?"required":""}></div><div class="field ${authMode==="signup"&&roleChoice==="restaurant"?"":"hidden"}"><label>RESTAURANT NAME</label><input name="restaurantName" placeholder="e.g. Foodtrack Kitchen"></div><div class="field"><label>EMAIL OR PHONE NUMBER</label><input name="identity" placeholder="you@example.com or phone" required></div><div class="field"><label>PASSWORD</label><input name="password" type="password" minlength="6" placeholder="At least 6 characters" required></div><button class="primary full" type="submit">${authMode==="signup"?"Create "+roleNames[roleChoice]+" account":"Login as "+roleNames[roleChoice]} →</button></form><p style="text-align:center;margin-bottom:0;font-size:13px">${authMode==="signup"?"Already registered?":"New to Foodtrack?"} <button class="linkbtn" onclick="switchAuth()">${authMode==="signup"?"Login":"Sign up"}</button></p><div class="demo-note">First-year project demo: create three separate accounts (customer, restaurant and delivery partner) to test the complete flow. Use any email/phone and a password of at least 6 characters.</div></div></div>`;
document.getElementById("authForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),identity=String(f.get("identity")).trim(),payload={role:roleChoice,password:f.get("password")};if(authMode==="signup"){payload.name=f.get("name");payload.restaurantName=f.get("restaurantName");if(identity.includes("@"))payload.email=identity;else payload.phone=identity;}else payload.identity=identity;try{const data=await api("/auth/"+(authMode==="signup"?"signup":"login"),{method:"POST",body:JSON.stringify(payload)});setSession(data)}catch(err){toast(err.message)}};
}
async function startApp(){try{menu=await api("/menu");await refreshOrders()}catch(e){toast(e.message)}if(!socket&&window.io){socket=io();socket.on("order:update",o=>{refreshOrders();if(user?.role==="customer"&&o.customerId===user.id)toast("Order update: "+(statusNames[o.status]||o.status));});socket.on("location:update",d=>{if(activeOrder&&(d.orderId===activeOrder.id||d.orderId===activeOrder._id)){activeOrder.deliveryLocation=d.location;if(map)drawMap()}})}renderApp()}
async function refreshOrders(){try{orders=await api("/orders")}catch{orders=[]}}
function navItems(){return user.role==="customer"?["home","search","favorites","tokens","account","settings"]:user.role==="delivery"?["home","search","account","settings"]:["home","search","account","settings"]}
function nav(){return `<nav class="nav">${navItems().map(s=>`<button class="${section===s?"active":""}" onclick="go('${s}')"><span class="ico">${icons[s]||"⌂"}</span>${s[0].toUpperCase()+s.slice(1)}</button>`).join("")}</nav>`}
function header(){return `<header class="app-header"><div class="app-header-inner"><div class="brand"><div class="logo" style="width:36px;height:36px;border-radius:12px;font-size:19px">🍔</div>Food<span>track</span></div><div class="user-chip"><div class="avatar">${esc((user.name||"U").slice(0,1).toUpperCase())}</div><div><div>${esc(user.name)}</div><div class="small muted">${roleNames[user.role]}</div></div><button class="ghost" style="padding:9px 10px;margin-left:4px" onclick="logout()">↪</button></div></div></header>`}
function go(s){section=s;renderApp()}
function renderApp(){if(!user){renderAuth();return}if(section==="home")renderHome();else if(section==="search")renderSearch();else if(section==="favorites")renderFavorites();else if(section==="tokens")renderTokens();else if(section==="account")renderAccount();else if(section==="settings")renderSettings();else renderHome()}
function shell(content){root.innerHTML=`<div class="app-shell">${header()}<main class="content">${content}</main>${nav()}</div>`}
function customerHero(){return `<section class="hero"><div><span class="pill">FRESH • FAST • TRACKED</span><h1>Good food,<br>right to your door.</h1><p>Discover local favourites and follow your order live, from kitchen to doorstep.</p><button class="primary" onclick="go('search')">Explore food&nbsp; →</button></div><div class="hero-art">🍔</div></section>`}
function foodCard(m){return `<article class="card"><div class="food-art">${m.emoji||"🍽️"}</div><h3>${esc(m.name)}</h3><p>${esc(m.description||m.category||"Made fresh for you")}</p><div class="price-row"><span class="price">₹${Number(m.price).toFixed(0)}</span><button class="add" onclick="addCart('${m.id}')">＋ Add</button></div><button class="linkbtn" style="padding:8px 0 0" onclick="toggleFav('${m.id}')">${favorites.includes(m.id)?"♥ Saved":"♡ Add to favorites"}</button></article>`}
function renderHome(){if(user.role==="customer"){const featured=menu.slice(0,4);shell(`${customerHero()}<div class="section-head"><div><h2>Popular near you</h2><div class="muted small">Fresh picks from Foodtrack Kitchen</div></div><button class="linkbtn" onclick="go('search')">See all →</button></div><div class="grid">${featured.map(foodCard).join("")}</div><div class="section-head"><div><h2>Your active orders</h2><div class="muted small">Updates arrive in real time</div></div></div>${customerOrders()}`);return}
if(user.role==="restaurant"){shell(`<section class="hero"><div><span class="pill">RESTAURANT PARTNER</span><h1>Kitchen<br>control centre.</h1><p>Manage incoming orders, prepare meals and hand them to nearby delivery partners.</p></div><div class="hero-art">👨‍🍳</div></section><div class="section-head"><h2>Order overview</h2><button class="ghost" onclick="refreshAndRender()">↻ Refresh</button></div><div class="stats"><div class="card stat"><span>New</span><strong>${orders.filter(o=>o.status==="pending").length}</strong></div><div class="card stat"><span>Preparing</span><strong>${orders.filter(o=>["accepted","preparing"].includes(o.status)).length}</strong></div><div class="card stat"><span>Ready</span><strong>${orders.filter(o=>o.status==="ready").length}</strong></div></div><div class="section-head"><h2>Incoming & active orders</h2></div>${restaurantOrders()}`);return}
shell(`<section class="hero"><div><span class="pill">DELIVERY PARTNER</span><h1>Deliver smiles.<br>Earn trust.</h1><p>Go online to see available orders, accept a nearby delivery and share your live GPS position.</p><label class="toggle"><input type="checkbox" ${online?"checked":""} onchange="toggleOnline(this.checked)"><b>${online?"You are online":"Go online to receive orders"}</b></label></div><div class="hero-art">🛵</div></section><div class="section-head"><h2>Delivery dashboard</h2><button class="ghost" onclick="refreshAndRender()">↻ Refresh</button></div><div class="stats"><div class="card stat"><span>Available</span><strong>${orders.filter(o=>o.status==="ready"&&(!o.deliveryPartnerId||o.deliveryPartnerId===user.id)).length}</strong></div><div class="card stat"><span>Active</span><strong>${orders.filter(o=>o.deliveryPartnerId===user.id&&["ready","picked_up"].includes(o.status)).length}</strong></div><div class="card stat"><span>Completed</span><strong>${orders.filter(o=>o.deliveryPartnerId===user.id&&o.status==="delivered").length}</strong></div></div><div class="section-head"><h2>Available deliveries</h2></div>${deliveryOrders()}`);
}
function customerOrders(){const mine=orders.filter(o=>o.customerId===user.id);if(!mine.length)return `<div class="card empty"><div class="emoji">🛍️</div><b>No orders yet</b><p>Your orders will appear here after checkout.</p><button class="primary" onclick="go('search')">Order food</button></div>`;return `<div class="order-list">${mine.slice(0,3).map(o=>orderCard(o,"customer")).join("")}</div>`}
function restaurantOrders(){const list=orders.filter(o=>o.restaurantId===user.id||o.restaurantId==="demo-restaurant");if(!list.length)return `<div class="card empty"><div class="emoji">🍽️</div><b>Waiting for your first order</b><p>Customer orders appear here automatically.</p></div>`;return `<div class="order-list">${list.map(o=>orderCard(o,"restaurant")).join("")}</div>`}
function deliveryOrders(){const list=orders.filter(o=>(o.status==="ready"&&(!o.deliveryPartnerId||o.deliveryPartnerId===user.id))||(o.deliveryPartnerId===user.id&&["picked_up","delivered"].includes(o.status)));if(!list.length)return `<div class="card empty"><div class="emoji">🛵</div><b>No deliveries available</b><p>When a restaurant marks an order ready, it will appear here.</p></div>`;return `<div class="order-list">${list.map(o=>orderCard(o,"delivery")).join("")}</div>`}
function orderCard(o,mode){const id=o.id||o._id;let actions="";if(mode==="customer"&&["ready","picked_up","delivered"].includes(o.status))actions+=`<button class="primary" onclick="trackOrder('${id}')">📍 Track order</button>`;if(mode==="customer"&&o.status==="delivered"&&o.paymentStatus!=="demo-paid")actions+=`<button class="secondary" onclick="showQR('${id}')">▦ Verify & pay (demo)</button>`;if(mode==="restaurant"){if(o.status==="pending")actions+=`<button class="primary" onclick="setStatus('${id}','accepted')">Accept order</button><button class="danger" onclick="setStatus('${id}','rejected')">Reject</button>`;if(o.status==="accepted")actions+=`<button class="primary" onclick="setStatus('${id}','preparing')">Start preparing</button>`;if(o.status==="preparing")actions+=`<button class="primary" onclick="setStatus('${id}','ready')">✓ Mark ready</button>`}if(mode==="delivery"){if(o.status==="ready"&&(!o.deliveryPartnerId||o.deliveryPartnerId===user.id))actions+=`<button class="primary" onclick="acceptDelivery('${id}')">Accept delivery</button>`;if(o.status==="ready"&&o.deliveryPartnerId===user.id)actions+=`<button class="secondary" onclick="setStatus('${id}','picked_up')">Confirm pickup</button>`;if(o.status==="picked_up"&&o.deliveryPartnerId===user.id)actions+=`<button class="primary" onclick="startGPS('${id}')">📍 Share live GPS</button><button class="secondary" onclick="setStatus('${id}','delivered')">Mark delivered</button>`}
return `<article class="order-card"><div class="order-top"><div><b>${esc(o.orderCode||id.slice(-8))}</b><p style="margin:7px 0;color:#6b7280;font-size:13px">${esc((o.items||[]).map(i=>`${i.qty||1}× ${i.name}`).join(", "))}</p><div class="small muted">${mode==="restaurant"?"Customer: "+esc(o.customerName):mode==="delivery"?"Deliver to: "+esc(o.address):esc(o.restaurantName||"Foodtrack Kitchen")}</div><div class="price" style="margin-top:8px">₹${Number(o.total||0).toFixed(0)}</div></div><span class="status ${o.paymentStatus==="demo-paid"?"demo-paid":""}">${esc(o.paymentStatus==="demo-paid"?"Paid (demo)":statusNames[o.status]||o.status)}</span></div>${o.deliveryPartnerName?`<p class="small muted">🛵 Partner: ${esc(o.deliveryPartnerName)}</p>`:""}${o.status==="picked_up"&&mode==="customer"?`<div class="demo-note">Your delivery is on the way. Open live tracking to see location updates.</div>`:""}<div class="order-actions">${actions}</div></article>`}
function renderSearch(){shell(`<div class="section-head" style="margin-top:4px"><div><h2>Find your favourite</h2><div class="muted small">Search dishes and explore the menu</div></div></div><div class="searchbar"><input id="foodSearch" placeholder="🔍 Search burgers, pizza, dosa…" value="${esc(query)}"><button class="primary" onclick="query=document.getElementById('foodSearch').value;renderSearch()">Search</button></div><div class="categories">${["All",...new Set(menu.map(m=>m.category))].map(c=>`<button class="${category===c?"active":""}" onclick="category='${esc(c)}';renderSearch()">${esc(c)}</button>`).join("")}</div><div class="grid">${menu.filter(m=>(category==="All"||m.category===category)&&(`${m.name} ${m.category}`.toLowerCase().includes(query.toLowerCase()))).map(foodCard).join("")||`<div class="card empty">No food items found.</div>`}</div><div class="section-head"><h2>Your cart (${cart.reduce((s,i)=>s+i.qty,0)})</h2></div>${cart.length?`<div class="card">${cart.map(i=>`<div class="profile-row"><span>${esc(i.name)} × ${i.qty}</span><b>₹${i.price*i.qty}</b><button class="linkbtn" onclick="removeCart('${i.id}')">Remove</button></div>`).join("")}<div class="price-row"><b>Total</b><span class="price">₹${cart.reduce((s,i)=>s+i.price*i.qty,0)}</span></div><div class="field"><label>DELIVERY ADDRESS</label><textarea id="deliveryAddress" placeholder="House no., street, area, city" rows="2"></textarea></div><button class="primary full" onclick="placeOrder()">Place order →</button></div>`:`<div class="card empty">Add a dish to start your order.</div>`}`);const inp=document.getElementById("foodSearch");if(inp)inp.addEventListener("keydown",e=>{if(e.key==="Enter"){query=inp.value;renderSearch()}})}
function addCart(id){const m=menu.find(x=>x.id===id);if(!m)return;const existing=cart.find(x=>x.id===id);if(existing)existing.qty++;else cart.push({...m,qty:1});toast(m.name+" added to cart");if(section==="search")renderSearch()}
function removeCart(id){cart=cart.filter(x=>x.id!==id);renderSearch()}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem("ft_favs",JSON.stringify(favorites));toast(favorites.includes(id)?"Added to favorites":"Removed from favorites");renderApp()}
function renderFavorites(){shell(`<div class="section-head"><div><h2>Your favorites ♥</h2><div class="muted small">Your saved food picks</div></div></div><div class="grid">${menu.filter(m=>favorites.includes(m.id)).map(foodCard).join("")||`<div class="card empty"><div class="emoji">♡</div><b>No favorites saved yet</b><p>Tap “Add to favorites” on any dish.</p><button class="primary" onclick="go('search')">Explore food</button></div>`}</div>`)}
function renderTokens(){shell(`<div class="section-head"><div><h2>Foodtrack Tokens ◈</h2><div class="muted small">Demo rewards wallet</div></div></div><div class="hero"><div><span class="pill">REWARDS WALLET</span><h1 style="font-size:40px">🪙 ${orders.filter(o=>o.customerId===user.id&&o.status==="delivered").length*10} tokens</h1><p>Earn 10 demo tokens for each completed order. Tokens have no cash value in this prototype.</p></div><div class="hero-art">🎁</div></div><div class="demo-note">Tokens are demonstration reward points only. They are not money and cannot be redeemed.</div>`)}
function renderAccount(){shell(`<div class="section-head"><h2>My account</h2></div><div class="card"><div style="display:flex;gap:14px;align-items:center;margin-bottom:20px"><div class="avatar" style="width:58px;height:58px;font-size:23px">${esc(user.name.slice(0,1).toUpperCase())}</div><div><h2 style="margin:0">${esc(user.name)}</h2><p class="muted" style="margin:4px 0">${roleNames[user.role]}</p></div></div><div class="profile-row"><span class="muted">Email</span><b>${esc(user.email||"Not provided")}</b></div><div class="profile-row"><span class="muted">Phone</span><b>${esc(user.phone||"Not provided")}</b></div>${user.restaurantName?`<div class="profile-row"><span class="muted">Restaurant</span><b>${esc(user.restaurantName)}</b></div>`:""}<div class="profile-row"><span class="muted">Account type</span><b>${roleNames[user.role]}</b></div><button class="danger full" style="margin-top:18px" onclick="logout()">Log out</button></div><div class="section-head"><h2>Order history</h2></div>${user.role==="customer"?customerOrders():user.role==="restaurant"?restaurantOrders():deliveryOrders()}`)}
function renderSettings(){shell(`<div class="section-head"><h2>Settings ⚙</h2></div><div class="card"><div class="profile-row"><div><b>Foodtrack notifications</b><p class="muted small">Order status notifications in this browser</p></div><span class="pill">Enabled</span></div><div class="profile-row"><div><b>Location access</b><p class="muted small">Used only while sharing delivery location</p></div><button class="secondary" onclick="requestLocation()">Check GPS</button></div><div class="profile-row"><div><b>Application</b><p class="muted small">Foodtrack first-year project prototype</p></div><span class="pill">v1.0</span></div><button class="ghost full" style="margin-top:15px" onclick="api('/health').then(x=>toast('API online • '+x.database)).catch(e=>toast(e.message))">Test backend connection</button></div><div class="demo-note">Privacy note: GPS is requested only after you tap a location-sharing action. Use demo accounts and avoid entering sensitive personal information.</div>`)}
async function placeOrder(){const address=document.getElementById("deliveryAddress")?.value.trim();if(!cart.length)return toast("Your cart is empty.");if(!address)return toast("Please enter your delivery address.");try{const o=await api("/orders",{method:"POST",body:JSON.stringify({items:cart.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty})),address,customerLocation:currentLocation,restaurantName:"Foodtrack Kitchen",restaurantLocation:{lat:22.7196,lng:75.8577}})});cart=[];await refreshOrders();section="home";renderApp();toast("Order placed! Restaurant has been notified.");}catch(e){toast(e.message)}}
async function setStatus(id,status){try{await api(`/orders/${id}/status`,{method:"PATCH",body:JSON.stringify({status})});await refreshOrders();renderApp();toast("Order status: "+(statusNames[status]||status))}catch(e){toast(e.message)}}
async function acceptDelivery(id){try{await api(`/orders/${id}/accept-delivery`,{method:"POST",body:"{}"});await refreshOrders();renderApp();toast("Delivery accepted")}catch(e){toast(e.message)}}
async function refreshAndRender(){await refreshOrders();renderApp();toast("Orders refreshed")}
function stopGPS(){if(watchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(watchId);watchId=null}}
function requestLocation(){if(!navigator.geolocation)return toast("GPS is not supported by this browser.");navigator.geolocation.getCurrentPosition(pos=>{currentLocation={lat:pos.coords.latitude,lng:pos.coords.longitude};toast("GPS permission working.");},e=>toast("Location unavailable: "+e.message),{enableHighAccuracy:true,timeout:10000})}
async function toggleOnline(v){online=v;if(!v){stopGPS();try{await api("/me/location",{method:"PATCH",body:JSON.stringify({isOnline:false})})}catch{}}else{if(!navigator.geolocation){toast("GPS is not supported.");online=false;return renderApp()}navigator.geolocation.getCurrentPosition(async pos=>{currentLocation={lat:pos.coords.latitude,lng:pos.coords.longitude};try{await api("/me/location",{method:"PATCH",body:JSON.stringify({...currentLocation,isOnline:true})});toast("You are online and location is ready.");}catch(e){toast(e.message)}renderApp()},e=>{online=false;toast("Allow location permission to go online.");renderApp()},{enableHighAccuracy:true,timeout:12000})}if(!v)toast("You are offline.");renderApp()}
function startGPS(id){activeOrder=orders.find(o=>(o.id||o._id)===id);if(!activeOrder)return;if(!navigator.geolocation)return toast("GPS not supported.");stopGPS();navigator.geolocation.getCurrentPosition(async pos=>{const point={lat:pos.coords.latitude,lng:pos.coords.longitude};currentLocation=point;try{await api("/me/location",{method:"PATCH",body:JSON.stringify({...point,isOnline:true})});await api(`/orders/${id}/location`,{method:"POST",body:JSON.stringify(point)});toast("Live GPS sharing started.");trackOrder(id);watchId=navigator.geolocation.watchPosition(async p=>{const loc={lat:p.coords.latitude,lng:p.coords.longitude};currentLocation=loc;try{await api("/me/location",{method:"PATCH",body:JSON.stringify({...loc,isOnline:true})});await api(`/orders/${id}/location`,{method:"POST",body:JSON.stringify(loc)});activeOrder.deliveryLocation={...loc,at:new Date().toISOString()};if(map)drawMap()}catch(e){}},{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}catch(e){toast(e.message)}},e=>toast("Allow location permission. Public deployment needs HTTPS."),{enableHighAccuracy:true,timeout:12000})}
function trackOrder(id){activeOrder=orders.find(o=>(o.id||o._id)===id)||activeOrder;if(!activeOrder)return;section="tracking";renderTracking()}
function renderTracking(){const o=activeOrder;if(!o)return go("home");shell(`<div class="section-head"><div><button class="linkbtn" onclick="go('home')">← Back</button><h2>Live delivery tracking</h2><div class="muted small">Order ${esc(o.orderCode||"")}</div></div><span class="status">${esc(statusNames[o.status]||o.status)}</span></div><div class="track-layout"><div class="card" style="padding:10px"><div id="trackingMap" class="map"></div><div class="price-row" style="padding:5px 6px"><span class="muted small">Map powered by OpenStreetMap</span><button class="ghost" onclick="openExternalMap()">↗ Directions</button></div></div><div class="card"><h3>Delivery progress</h3><div class="steps">${["pending","accepted","preparing","ready","picked_up","delivered"].map((s,i)=>`<div class="step ${["pending","accepted","preparing","ready","picked_up","delivered"].indexOf(o.status)>=i?"done":""}"><div class="step-dot">${i+1}</div><div><b>${statusNames[s]}</b><p>${i===0?"Restaurant receives your order":i===3?"Partner gets ready to pick up":i===4?"Track the rider on the map":i===5?"Your order has arrived":"Order progress updates automatically"}</p></div></div>`).join("")}</div><div class="profile-row"><span class="muted">Restaurant</span><b>${esc(o.restaurantName||"Foodtrack Kitchen")}</b></div><div class="profile-row"><span class="muted">Delivery partner</span><b>${esc(o.deliveryPartnerName||"Finding nearby partner…")}</b></div><div class="profile-row"><span class="muted">Deliver to</span><b style="text-align:right;max-width:58%">${esc(o.address)}</b></div><div class="demo-note">Live GPS appears when the assigned delivery partner taps “Share live GPS” and grants location permission. The map may show restaurant/customer markers before GPS is available.</div>${o.status==="delivered"&&o.paymentStatus!=="demo-paid"?`<button class="primary full" onclick="showQR('${o.id||o._id}')">Show QR verification</button>`:""}</div></div>`);setTimeout(initMap,150)}
function drawMap(){if(!map||!activeOrder)return;const o=activeOrder;const points=[];const restaurant=o.restaurantLocation||{lat:22.7196,lng:75.8577};const customer=o.customerLocation||{lat:22.728,lng:75.87};if(restaurant.lat!=null)points.push([restaurant.lat,restaurant.lng]);if(customer.lat!=null)points.push([customer.lat,customer.lng]);if(o.deliveryLocation)points.push([o.deliveryLocation.lat,o.deliveryLocation.lng]);map.eachLayer(l=>{if(l instanceof L.Marker||l instanceof L.Polyline)L.removeLayer(l)});if(restaurant.lat!=null)L.marker([restaurant.lat,restaurant.lng]).addTo(map).bindPopup("🍽️ Restaurant");if(customer.lat!=null)L.marker([customer.lat,customer.lng]).addTo(map).bindPopup("🏠 Delivery address");if(o.deliveryLocation)L.marker([o.deliveryLocation.lat,o.deliveryLocation.lng]).addTo(map).bindPopup("🛵 Delivery partner • live GPS");if(points.length>1)L.polyline(points,{color:"#f97316",weight:4,dashArray:"8 8"}).addTo(map);if(points.length>1)map.fitBounds(points,{padding:[25,25]});}
function initMap(){const el=document.getElementById("trackingMap");if(!el||!window.L)return;const o=activeOrder;map=L.map(el).setView([22.7196,75.8577],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);drawMap();setTimeout(()=>map&&map.invalidateSize(),150)}
function openExternalMap(){const o=activeOrder;if(!o)return;const dest=o.deliveryLocation?`${o.deliveryLocation.lat},${o.deliveryLocation.lng}`:o.address;window.open("https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest),"_blank")}
async function showQR(id){try{const d=await api(`/orders/${id}/qr`);const o=orders.find(x=>(x.id||x._id)===id)||activeOrder;const html=`<div class="section-head"><div><button class="linkbtn" onclick="go('home')">← Back</button><h2>Delivery verification</h2></div></div><div class="card qrbox"><span class="pill">DEMO MODE ONLY</span><h2>Order total ₹${Number(d.amount).toFixed(0)}</h2><img src="${d.qr}" alt="Demo order QR code"><p class="muted small">Show this QR to verify the order. This does not transfer money.</p><div class="demo-note">Demo token: ${esc(d.token.slice(0,10))}…<br>Real payments require a payment gateway integration.</div><button class="primary full" onclick="confirmDemoPayment('${id}','${esc(d.token)}')">Confirm demo payment</button></div>`;shell(html)}catch(e){toast(e.message)}}
async function confirmDemoPayment(id,qrToken){try{await api(`/orders/${id}/verify-payment`,{method:"POST",body:JSON.stringify({qrToken})});await refreshOrders();go("home");toast("Demo payment confirmed — no money transferred.")}catch(e){toast(e.message)}}
if(token&&user)startApp();else renderAuth();
</script></body></html>
